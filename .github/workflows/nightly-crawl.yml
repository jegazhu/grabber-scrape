
name: Nightly Crawl (Mock DB)

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      spider:
        description: "Spider to run"
        required: true
        default: "quotes_js"
        type: choice
        options: [quotes_static, quotes_js]

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
      options: --user root

    env:
      MONGO_DB: stealth_scrape
      SPIDER: ${{ github.event.inputs.spider || 'quotes_js' }}
      # We no longer need the MONGO_URI secret here

    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Playwright browser
        run: |
          # Version-locked install — matches playwright==1.47.0 in requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verify Chromium launches
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--no-sandbox", "--disable-dev-shm-usage"],
              )
              page = browser.new_page()
              page.goto("https://quotes.toscrape.com/js/", wait_until="networkidle")
              page.wait_for_selector("div.quote", timeout=15000)
              n = len(page.query_selector_all("div.quote"))
              print(f"Found {n} quotes in a real browser")
              assert n > 0, "Chromium launched but rendered no quotes"
              browser.close()
          PY

      - name: Run crawl
        id: crawl
        run: |
          mkdir -p output logs
          # The --mock flag tells our script to use the in-memory DB
          python scripts/run_crawl.py "$SPIDER" --mock             2>&1 | tee logs/crawl.log
          grep '^CRAWL_SUMMARY=' logs/crawl.log             | tail -n1             | sed 's/^CRAWL_SUMMARY=//' > /tmp/summary.json
          echo "summary=$(cat /tmp/summary.json)" >> "$GITHUB_OUTPUT"

      - name: Assert non-empty result
        run: |
          ITEMS=$(python -c "import json;print(json.load(open('/tmp/summary.json'))['items'])")
          echo "Scraped $ITEMS items"
          if [ "$ITEMS" -lt 1 ]; then
            echo "::error::Crawl returned zero items — treating as failure"
            exit 1
          fi

      - name: Upload crawl artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-${{ env.SPIDER }}-${{ github.run_id }}
          path: |
            output/*.json
            logs/*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          if [ -f /tmp/summary.json ]; then
            echo "## Crawl summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
