name: Nightly Crawl (Mock DB)

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      spider:
        description: "Spider to run"
        required: true
        default: "quotes_js"
        type: choice
        options: [quotes_static, quotes_js]

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MONGO_DB: stealth_scrape
      SPIDER: ${{ github.event.inputs.spider || 'quotes_js' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Freeze resolved versions
        run: pip freeze > /tmp/resolved-versions.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Verify Chromium launches
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=["--no-sandbox", "--disable-dev-shm-usage"],
              )
              page = browser.new_page()
              page.goto("https://quotes.toscrape.com/js/",
                        wait_until="networkidle", timeout=30000)
              page.wait_for_selector("div.quote", timeout=30000)
              n = len(page.query_selector_all("div.quote"))
              print(f"Found {n} quotes in a real browser")
              assert n > 0, "Chromium launched but rendered no quotes"
              browser.close()
          PY

      - name: Run crawl
        id: crawl
        run: |
          mkdir -p output logs
          set -o pipefail
          python scripts/run_crawl.py "$SPIDER" --mock \
            2>&1 | tee logs/crawl.log
          grep '^CRAWL_SUMMARY=' logs/crawl.log \
            | tail -n1 \
            | sed 's/^CRAWL_SUMMARY=//' > /tmp/summary.json
          echo "summary=$(cat /tmp/summary.json)" >> "$GITHUB_OUTPUT"

      - name: Assert non-empty result
        run: |
          ITEMS=$(python -c "import json;print(json.load(open('/tmp/summary.json'))['items'])")
          echo "Scraped $ITEMS items"
          if [ "$ITEMS" -lt 1 ]; then
            echo "::error::Crawl returned zero items — treating as failure"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: crawl-${{ env.SPIDER }}-${{ github.run_id }}
          path: |
            output/*.json
            logs/*.log
            /tmp/resolved-versions.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          if [ -f /tmp/summary.json ]; then
            echo "## Crawl summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
